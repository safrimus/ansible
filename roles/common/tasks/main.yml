---
# Add apt key and repo for nginx
- apt_key:
    url: http://nginx.org/keys/nginx_signing.key
    state: present

- apt_repository:
    repo: 'deb http://nginx.org/packages/mainline/ubuntu/ xenial nginx'
    state: present
    filename: 'nginx'

- name: install apt packages
  apt:
    name: "{{ item }}"
    update_cache: yes
    state: latest
  with_items:
    - chromium-browser
    - vim
    - python3-psycopg2
    - libpq-dev
    - postgresql
    - python3-pip
    - nginx
    - python3-django
    - python3-gunicorn
    - python3-django-cors-headers
    - python3-djangorestframework
    - python3-django-filters
    - python3-xlwt
    - python3-xlrd

- name: Install drf-queryfields directly from GitHub
  ansible.builtin.pip:
    name: "git+https://github.com/wimglenn/djangorestframework-queryfields.git"
    state: present
    # Use --break-system-packages ONLY if you aren't using a virtualenv
    extra_args: "--break-system-packages" 
  become: true
