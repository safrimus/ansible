---
- name: Create the destination directory
  become: true
  ansible.builtin.file:
    path: /var/www/pos
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: get pos source code from git
  git:
    repo: "https://github.com/safrimus/pos.git"
    dest: "{{ lookup('env', 'HOME') }}/pos"

- name: Copy files from home to /var/www
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/pos/."
    dest: "/var/www/pos/."
    remote_src: yes
    owner: www-data
    group: www-data
    mode: '0644'
    directory_mode: '0755'
  become: true

- name: Fix permissions recursively (Folders 755, Files 644)
  ansible.builtin.file:
    path: "/var/www/pos"
    owner: www-data
    group: www-data
    recurse: yes
    state: directory
    mode: 'u=rwX,g=rX,o=rX'
  become: true

- name: delete default.conf nginx file
  file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  become: true

- name: place malikburhani nginx conf file
  template:
    src: malikburhani.conf.j2
    dest: /etc/nginx/conf.d/malikburhani.conf
  become: true

- name: place pos nginx conf file
  template:
    src: pos.conf.j2
    dest: /etc/nginx/conf.d/pos.conf
  become: true

- name: restart nginx
  systemd:
    name: nginx
    state: restarted
  become: true
