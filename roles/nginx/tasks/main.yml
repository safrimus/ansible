---
- name: Create the destination directory
  become: true
  ansible.builtin.file:
    path: "/var/www/pos"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: get pos source code from git
  git:
    repo: https://github.com/safrimus/pos.git
    dest: "{{ lookup('env', 'HOME') }}/pos"

- name: Copy files from home to /var/www
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/pos/."
    dest: "/var/www/pos/."
    remote_src: yes
    owner: www-data
    group: www-data
    mode: '0644'
    directory_mode: '0755'
  become: true

- name: fix permissions recursively (Folders 755, Files 644)
  ansible.builtin.file:
    path: "/var/www/pos"
    owner: www-data
    group: www-data
    recurse: yes
    state: directory
    mode: 'u=rwX,g=rX,o=rX'
  become: true

- name: ensure Nginx can traverse the user home directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}"
    mode: '0751'
    state: directory

- name: ensure Nginx can traverse the project directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/malikburhani"
    mode: '0751'
    state: directory

- name: remove default Nginx symbolic link
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true

- name: place malikburhani nginx conf file
  template:
    src: malikburhani.conf.j2
    dest: "/etc/nginx/sites-available/malikburhani.conf"
  become: true

- name: enable malikburhani config
  ansible.builtin.file:
    src: /etc/nginx/sites-available/malikburhani
    dest: /etc/nginx/sites-enabled/malikburhani
    state: link
  become: true

- name: restart nginx
  systemd:
    name: nginx
    state: restarted
  become: true
