---
- name: Ensure /var/www exists and has correct base permissions
  ansible.builtin.file:
    path: "/var/www"
    state: directory
    mode: '0755'

- name: get pos source code from git
  git:
    repo: "https://github.com/safrimus/pos.git"
    dest: "{{ lookup('env', 'HOME') }}/pos"

- name: Set ownership and permissions for Nginx
  ansible.builtin.file:
    path: "/var/www/pos"
    owner: www-data
    group: www-data
    recurse: yes
    state: directory
    mode: '0755'

- name: Ensure files inside have read permissions
  ansible.builtin.command:
    cmd: "find /var/www/pos/ -type f -exec chmod 644 {} +"
  changed_when: false

- name: delete default.conf nginx file
  file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  become: true

- name: place malikburhani nginx conf file
  template:
    src: malikburhani.conf.j2
    dest: /etc/nginx/conf.d/malikburhani.conf
  become: true

- name: place pos nginx conf file
  template:
    src: pos.conf.j2
    dest: /etc/nginx/conf.d/pos.conf
  become: true

- name: restart nginx
  systemd:
    name: nginx
    state: restarted
  become: true
